sentence=Shared onboard-sensor HAL for the Waveshare AMOLED 1.8 board.
paragraph=Battery (AXP2101), RTC (PCF85063), IMU (QMI8658), and audio (ES8311) helpers plus a battery+clock header widget. Reuses the already-initialized Wire bus shared with the SH8601 display and FT3168 touch. Consumed by both the launcher and AppKit apps.
